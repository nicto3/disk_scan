name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install --upgrade pyinstaller send2trash
      - name: Build standalone executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name DiskHunter --hidden-import send2trash --collect-all send2trash disk_hunter.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: DiskHunter-Windows
          path: dist/DiskHunter.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DiskHunter.exe
          generate_release_notes: true
